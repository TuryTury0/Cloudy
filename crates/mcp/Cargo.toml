[package]
name = "anytask-mcp"
description = "AnyTask MCP client: connects to MCP servers and offers their tools to the brain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anytask-core = { path = "../core" }
anytask-llm = { path = "../llm" }
async-trait = "0.1.92"
futures-util = "0.3"
http = "1"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "which-command", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
