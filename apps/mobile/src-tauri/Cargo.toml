[package]
name = "anytask-mobile"
description = "AnyTask phone app: status, chat and requests to the paired PC"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "anytask_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
anytask-remote = { path = "../../../crates/remote" }
tauri-plugin-anytask-phone = { path = "../plugins/phone" }
base64 = "0.22"
tokio = { workspace = true, features = ["time", "rt"] }

# Scanning the pairing QR code with the camera (phones only).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
